<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>
</head>
<body>
  <header>
    <h1>Cadastro de clientes</h1>
  </header>  
<main>
   <section>
    <h2>formulario de cadastro</h2>
   <form action="" method="post" name="cadastro_aluno" id="cadastro_aluno"></form>
   <label for="nome_aluno">Nome do Aluno:</label><br>
    <input type="text" name="nome_aluno" id="nome_aluno" size="50px"
    ><br><br>
     <label for="cpf">CPF:</label><br>
     <input type="text" name="cpf" size="50px">
    <br><br>
     <label for="Rg">Registro Geral:</label><br>
     <input type="text" name="rg" id="rg" size="50px">
    <br><br>
    <label for="endereço">Endereço:</label><br>
     <input type="text" name="endereco" id="endereço" size="50px">
    <br><br>
  <label for="genero">Gênero:</label>
  <input type="radio" name="genero" id="masculino" value="Masculino">masculino
  <input type="radio" name="genero" id="feminino" value="Feminino" >feminino
    <br><br>
  <label for="disciplinas">Disciplinas a cursar:</label><br><br>
  <input type="checkbox" name="disciplinas" value="Banco de dados">Banco_de_Dados
  <input type="checkbox" name="disciplinas" value="Algoritmos">Algoritmos
  <input type="checkbox" name="disciplinas" value="Novas Tecnologias">Novas_Tecnologias
  <input type="checkbox" name="disciplinas" value="Sistemas Operacionais">Sistemas_Operacionais
    <br><br>
    <label for="semestre">\Em qual semestre deseja matricular:</label><br><br>
    <select name="semestre" id="semeste">
    <option value="1semestre">1° Semestre</option>
    <option value="1semestre">2° Semestre</option>
    <option value="1semestre">3° Semestre</option>
    <option value="1semestre">4° Semestre</option>
    <option value="1semestre">5° Semestre</option>
    <option value="1semestre">6° Semestre</option>
    </select>
    <br><br>
  <label for="observaçoes">Observações:</label><br><br>
    <textarea name="observacoes" id="observacoes" rows="5" cols="50" ></textarea>
    <br><br>
    <label for="senha">Senha:</label><br><br>
    <input type="password" name="senha" id="senha">
    <br><br>
    <input type="submit" name="enviar" value="Enviar"><br><br>
    <input type="reset" name="limpar" value="Limpar">

    <form>
   </section>

</main>
<footer>
<p>Instituto federal do Paraná Campus Capanemaaa
<p>2026</p>
  
</footer>


</body>
</html>
